name: Update puzzles.json

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: clone main branch
      uses: actions/checkout@v4

    - name: Python Config
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run generate_json.py
      run: |
        python generate_json.py

    - name: Clone branch gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Copy puzzles.json to gh-pages
      run: |
        cp puzzles.json gh-pages/puzzles.json

    - name: Commit and push to gh-pages
      run: |
        cd gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add puzzles.json
        git commit -m "Updating puzzles.json" || echo "No updates"
        git push origin gh-pages
