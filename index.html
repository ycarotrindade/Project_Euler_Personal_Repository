<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Euler puzzles</title>
</head>
<body onload="filter_data()">
    <div id="main-content">
        <div id="header">
            <h1>Welcome to my Project Euler Solutions</h1>
        </div>
        <div id="search-box">
            <input type="text" name="searchBar" id="serchBar" oninput="filter_data(this)">
        </div>
        <br>
        <div id="problems-table">
            <table id="problems-table-table">
                <tr>
                    <th>Problem Name</th>
                    <th>Python</th>
                    <th>Golang</th>
                </tr>
            </table>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
